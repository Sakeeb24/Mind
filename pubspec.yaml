name: mindspace
description: "MindSpace — A free, AI-powered document intelligence and study assistant for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  filesize: ^2.0.1
  formz: ^0.7.0
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Code Generation (models)

  # Local Database (Hive Community Edition)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # PDF Rendering
  pdfx: ^2.6.0

  # Networking
  dio: ^5.8.0+1

  # File Handling
  file_picker: ^8.1.7
  path_provider: ^2.1.5

  # Image Caching

  # Notifications

  # Connectivity
  connectivity_plus: ^6.1.3

  # App Info
  package_info_plus: ^8.1.3

  # Routing
  go_router: ^14.8.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation

  # Testing
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

